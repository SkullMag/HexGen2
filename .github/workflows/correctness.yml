name: CPU correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/hexgen2-matplotlib
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU validation environment
        run: |
          python -m pip install pip==24.3.1
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-reproduction.txt
          pip check
      - name: Verify source and shell syntax
        run: |
          python scripts/verify_upstream.py
          bash -n scripts/fabric/*.sh
      - name: Validate real multi-process transfer and failure capture
        run: python -m unittest discover -s tests -v
